# Запуск на VPS:
#   docker compose build
#   docker compose run --rm bench                      # бенчмарк диалога диспетчера
#   docker compose run --rm bench bench.py --runs 5 --warmup 2 --concurrency 2
#   docker compose up -d demo                          # веб-демо на http://VPS_IP:7860
#
# Подстройте cpus/mem_limit под свой VPS (по умолчанию 4 CPU / 6 ГБ).
services:
  bench:
    build: .
    image: terattsv2:latest
    # Сценарий по умолчанию: диалог такси-диспетчера + отчёт в ./out/bench.json
    command: ["bench.py", "--runs", "3", "--warmup", "1", "--json", "out/bench.json"]
    environment:
      # Пробрасываем переменные хоста в контейнер (если не заданы — берутся дефолты кода)
      - TERATTS_THREADS
      - OMP_NUM_THREADS
      - TERATTS_REVISION
      - HF_TOKEN
    volumes:
      - hf-cache:/models      # кэш модели (скачивается один раз)
      - ./out:/app/out        # отчёты JSON наружу
    # uid/gid контейнера = uid/gid владельца папки out, чтобы отчёт точно записался.
    # Под root это 0:0, под обычным пользователем — 1000:1000.
    # Проще всего запускать через ./bench.sh — он подставляет значения автоматически.
    user: "${TERATTS_UID:-1000}:${TERATTS_GID:-1000}"
    # Лимиты CPU/RAM не заданы: контейнер использует все ядра VPS (это и есть честный замер).
    # Ограничить можно при запуске, например:
    #   docker compose run --rm --cpus 2 --memory 3g bench
    #   docker compose run --rm --memory 12g bench bench.py --scenario none --concurrency 3

  demo:
    build: .
    image: terattsv2:latest
    command: ["app.py", "--host", "0.0.0.0", "--port", "7860"]
    environment:
      - TERATTS_THREADS
      - OMP_NUM_THREADS
    volumes:
      - hf-cache:/models
    ports:
      - "7860:7860"
    restart: unless-stopped

volumes:
  hf-cache:
